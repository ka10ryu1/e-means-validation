[project]
name = "e-means-validation"
version = "0.1.0"
description = "Independent CPU validation of Meta FAIR e-means (faiss.contrib.e_means) against Faiss k-means"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "faiss-cpu>=1.12",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
